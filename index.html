                  <div className="bg-white rounded-3xl shadow-2xl overflow-hidden max-w-6xl mx-auto flex flex-col lg:flex-row border border-slate-100">
                    
                    {/* Información */}
                    <div className="lg:w-2/5 bg-cyan-900 text-white p-10 md:p-14 flex flex-col justify-between relative overflow-hidden">
                      <div className="absolute top-0 right-0 w-64 h-64 bg-cyan-800 rounded-full opacity-50 blur-3xl -translate-y-1/2 translate-x-1/2"></div>
                      
                      <div className="relative z-10">
                        <h3 className="text-3xl font-serif font-bold mb-10 text-amber-400">{t.contactTag}</h3>
                        
                        <div className="space-y-8">
                          <div className="flex items-start group">
                            <div className="bg-cyan-800/50 p-3 rounded-lg mr-5 group-hover:bg-amber-500/20 transition-colors">
                              <MapPin className="text-amber-400" size={24} />
                            </div>
                            <div>
                              <h4 className="font-bold text-lg mb-1">Ubicación</h4>
                              <p className="text-cyan-100 leading-relaxed">
                                C. del Consolat de Mar, 66<br/>
                                43850 Cambrils<br/>
                                Tarragona
                              </p>
                            </div>
                          </div>
                          
                          <div className="flex items-start group">
                            <div className="bg-cyan-800/50 p-3 rounded-lg mr-5 group-hover:bg-amber-500/20 transition-colors">
                              <Phone className="text-amber-400" size={24} />
                            </div>
                            <div>
                              <h4 className="font-bold text-lg mb-1">Teléfono</h4>
                              <a href="tel:977360059" className="text-cyan-100 text-xl font-light hover:text-white transition-colors">
                                977 360 059
                              </a>
                            </div>
                          </div>

                          <div className="flex items-start group">
                            <div className="bg-cyan-800/50 p-3 rounded-lg mr-5 group-hover:bg-amber-500/20 transition-colors">
                              <Clock className="text-amber-400" size={24} />
                            </div>
                            <div>
                              <h4 className="font-bold text-lg mb-1">Horario</h4>
                              <p className="text-cyan-100 leading-relaxed">
                                Lunes a Domingo<br/>
                                13:00 - 16:00<br/>
                                20:00 - 23:00
                              </p>
                            </div>
                          </div>
                        </div>
                      </div>
                    </div>

                    {/* Formulario Interactivo */}
                    <div id="reservas" className="lg:w-3/5 p-10 md:p-14 bg-white relative">
                      <h3 className="text-3xl font-bold text-cyan-900 mb-8 font-serif">{t.contactTitle}</h3>
                      
                      {formStatus === 'success' ? (
                        <div className="h-full min-h-[400px] flex flex-col items-center justify-center text-center animate-fade-in-up">
                          <CheckCircle2 size={80} className="text-green-500 mb-6" />
                          <h4 className="text-2xl font-bold text-slate-800 mb-2">¡Reserva Solicitada!</h4>
                          <p className="text-slate-600 text-lg">{t.msgSuccess}</p>
                        </div>
                      ) : (
                        <form className="space-y-6" onSubmit={handleReservationSubmit}>
                          <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div>
                              <label className="block text-sm font-semibold text-slate-700 mb-2">{t.formName} *</label>
                              <input required type="text" className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3.5 focus:outline-none focus:ring-2 focus:ring-amber-500 focus:border-transparent transition-all" placeholder="Ej. Joan Martí" />
                            </div>
                            <div>
                              <label className="block text-sm font-semibold text-slate-700 mb-2">{t.formPhone} *</label>
                              <input required type="tel" className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3.5 focus:outline-none focus:ring-2 focus:ring-amber-500 focus:border-transparent transition-all" placeholder="+34 600 000 000" />
                            </div>
                          </div>
                          
                          <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                            <div>
                              <label className="block text-sm font-semibold text-slate-700 mb-2">{t.formDate} *</label>
                              <input required type="date" className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3.5 focus:outline-none focus:ring-2 focus:ring-amber-500 focus:border-transparent transition-all" />
                            </div>
                            <div>
                              <label className="block text-sm font-semibold text-slate-700 mb-2">{t.formTime} *</label>
                              <select required className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3.5 focus:outline-none focus:ring-2 focus:ring-amber-500 focus:border-transparent transition-all">
                                <option value="">Seleccionar...</option>
                                <option>13:00</option><option>13:30</option><option>14:00</option><option>14:30</option><option>15:00</option>
                                <option>20:00</option><option>20:30</option><option>21:00</option><option>21:30</option><option>22:00</option>
                              </select>
                            </div>
                            <div>
                              <label className="block text-sm font-semibold text-slate-700 mb-2">{t.formPax} *</label>
                              <select required className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3.5 focus:outline-none focus:ring-2 focus:ring-amber-500 focus:border-transparent transition-all">
                                <option value="2">2 personas</option>
                                <option value="3">3 personas</option>
                                <option value="4">4 personas</option>
                                <option value="5">5 personas</option>
                                <option value="6">6 personas</option>
                                <option value="mas">Más de 6 (Llamar)</option>
                              </select>
                            </div>
                          </div>

                          <div>
                            <label className="block text-sm font-semibold text-slate-700 mb-2">{t.formNotes}</label>
                            <textarea rows="3" placeholder="Alergias, trona para bebé, celebración especial..." className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3.5 focus:outline-none focus:ring-2 focus:ring-amber-500 focus:border-transparent transition-all resize-none"></textarea>
                          </div>

                          <button 
                            type="submit" 
                            disabled={formStatus === 'submitting'}
                            className="w-full bg-amber-500 text-white font-bold text-lg py-4 rounded-xl hover:bg-amber-600 transition-all flex justify-center items-center group shadow-lg shadow-amber-500/20 mt-6 disabled:opacity-70 disabled:cursor-not-allowed"
                          >
                            {formStatus === 'submitting' ? (
                              <><Loader2 className="animate-spin mr-2" /> {t.btnSubmitting}</>
                            ) : (
                              <>{t.btnSubmit} <ChevronRight className="ml-2 group-hover:translate-x-1 transition-transform" /></>
                            )}
                          </button>
                        </form>
                      )}
                    </div>

                  </div>
                </div>
              </section>
            </main>
            
          ) : (
            
            /* --- PÁGINA GALERÍA --- */
            <main className="bg-slate-50 pb-24 min-h-screen">
              <div className="relative h-80 md:h-[450px] flex items-center justify-center pt-20">
                <div className="absolute inset-0 z-0">
                  <img 
                    src="https://images.unsplash.com/photo-1544148103-0773bf10d330?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80" 
                    alt="Fondo Galería" 
                    className="w-full h-full object-cover opacity-90"
                  />
                  <div className="absolute inset-0 bg-cyan-950/80 backdrop-blur-[2px]"></div>
                </div>
                <div className="relative z-10 text-center px-4 animate-fade-in-up">
                  <h1 className="text-4xl md:text-6xl font-serif text-white font-bold mb-4 flex items-center justify-center gap-4">
                    <ImageIcon className="text-amber-400" size={48} /> {t.galTitle}
                  </h1>
                  <p className="text-cyan-100 text-lg md:text-xl max-w-2xl mx-auto font-light">
                    {t.galDesc}
                  </p>
                </div>
              </div>

              <div className="container mx-auto px-4 md:px-8 mt-12 mb-8">
                <button 
                  onClick={(e) => handleNavigation(e, 'home')}
                  className="inline-flex items-center text-cyan-900 font-bold hover:text-amber-500 transition-colors mb-8 bg-white py-2 px-4 rounded-full shadow-sm border border-slate-100"
                >
                  <ArrowLeft size={20} className="mr-2" /> {t.galBack}
                </button>

                <div className="grid grid-cols-1 md:grid-cols-3 gap-4 md:gap-6">
                  
                  <div className="md:col-span-2 md:row-span-2 relative group overflow-hidden rounded-2xl shadow-lg h-[400px] md:h-auto cursor-pointer">
                    <img src="https://images.unsplash.com/photo-1533682805518-48d1f5b8cb3a?ixlib=rb-4.0.3&auto=format&fit=crop&w=1200&q=80" alt={t.plato1} className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-700" />
                    <div className="absolute inset-0 bg-gradient-to-t from-black/80 via-black/20 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex items-end p-8">
                      <h3 className="text-white text-2xl font-serif font-bold">{t.plato1}</h3>
                    </div>
                  </div>

                  <div className="relative group overflow-hidden rounded-2xl shadow-lg h-72 md:h-80 cursor-pointer">
                    <img src="https://images.unsplash.com/photo-1615141982883-c7ad0e69fd62?ixlib=rb-4.0.3&auto=format&fit=crop&w=600&q=80" alt={t.plato2} className="w-full h-full object-cover group-hover:scale-110 transition-transform duration-500" />
                    <div className="absolute inset-0 bg-gradient-to-t from-black/80 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex items-end p-6">
                      <h3 className="text-white text-xl font-serif font-bold">{t.plato2}</h3>
                    </div>
                  </div>

                  <div className="relative group overflow-hidden rounded-2xl shadow-lg h-72 md:h-80 cursor-pointer">
                    <img src="https://images.unsplash.com/photo-1565299507177-b0ac66763828?ixlib=rb-4.0.3&auto=format&fit=crop&w=600&q=80" alt={t.plato3} className="w-full h-full object-cover group-hover:scale-110 transition-transform duration-500" />
                    <div className="absolute inset-0 bg-gradient-to-t from-black/80 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex items-end p-6">
                      <h3 className="text-white text-xl font-serif font-bold">{t.plato3}</h3>
                    </div>
                  </div>

                  <div className="relative group overflow-hidden rounded-2xl shadow-lg h-72 md:h-[350px] cursor-pointer">
                    <img src="https://images.unsplash.com/photo-1559339352-11d035aa65de?ixlib=rb-4.0.3&auto=format&fit=crop&w=600&q=80" alt={t.plato4} className="w-full h-full object-cover group-hover:scale-110 transition-transform duration-500" />
                    <div className="absolute inset-0 bg-gradient-to-t from-black/80 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex items-end p-6">
                      <h3 className="text-white text-xl font-serif font-bold">{t.plato4}</h3>
                    </div>
                  </div>

                  <div className="md:col-span-2 relative group overflow-hidden rounded-2xl shadow-lg h-72 md:h-[350px] cursor-pointer">
                    <img src="https://images.unsplash.com/photo-1599084993091-1cb5c0721cc6?ixlib=rb-4.0.3&auto=format&fit=crop&w=1200&q=80" alt={t.plato5} className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-700" />
                    <div className="absolute inset-0 bg-gradient-to-t from-black/80 via-black/10 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex items-end p-8">
                      <h3 className="text-white text-2xl font-serif font-bold">{t.plato5}</h3>
                    </div>
                  </div>

                </div>
              </div>
            </main>
          )}

          {/* --- FOOTER CON LOGO --- */}
          <footer className="bg-slate-900 text-slate-400 py-14 text-sm border-t border-slate-800">
            <div className="container mx-auto px-4 flex flex-col items-center text-center">
              
              <img 
                src="logo-acuamar.png" 
                alt="Restaurant Acuamar Logo" 
                className="h-16 md:h-20 w-auto object-contain mb-8 brightness-0 invert opacity-90 hover:opacity-100 transition-opacity" 
              />

              <div className="flex justify-center space-x-8 mb-10">
                <a href="#" className="hover:text-amber-400 transition-colors flex flex-col items-center gap-2"><Globe size={24}/> Instagram</a>
                <a href="#" className="hover:text-amber-400 transition-colors flex flex-col items-center gap-2"><Globe size={24}/> Facebook</a>
                <a href="#" className="hover:text-amber-400 transition-colors flex flex-col items-center gap-2"><Star size={24}/> TripAdvisor</a>
              </div>
              <div className="w-24 h-px bg-slate-700 mb-8"></div>
              <p className="mb-3 text-base">© {new Date().getFullYear()} Restaurant Acuamar (Casa Matas). Todos los derechos reservados.</p>
              <p className="text-base text-slate-500">C. del Consolat de Mar, 66, 43850 Cambrils | 977 360 059</p>
            </div>
          </footer>

          <style dangerouslySetInnerHTML={{__html: `
            @keyframes fadeInUp {
              from { opacity: 0; transform: translateY(20px); }
              to { opacity: 1; transform: translateY(0); }
            }
            .animate-fade-in-up {
              animation: fadeInUp 0.8s ease-out forwards;
              opacity: 0;
            }
          `}} />

        </div>
      );
    };

    createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
